name: Generate CV PDF

on:
  push:
    branches: [main]
    paths:
      - "data/cv.json"
      - "scripts/generate_cv.py"
      - ".github/workflows/generate-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-cv
  cancel-in-progress: true

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Stamp CV data update date
        run: |
          python - <<'PY'
          import json
          from datetime import date
          path = "data/cv.json"
          with open(path, encoding="utf-8") as source:
              data = json.load(source)
          data["updated_at"] = date.today().isoformat()
          with open(path, "w", encoding="utf-8") as target:
              json.dump(data, target, ensure_ascii=False, indent=2)
              target.write("\n")
          PY
      - name: Generate PDF
        run: python scripts/generate_cv.py
      - name: Commit updated PDF
        run: |
          if [ -z "$(git status --porcelain -- assets/docs/cv-noocoks.pdf)" ]; then
            echo "CV PDF is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv.json assets/docs/cv-noocoks.pdf
          git commit -m "chore(cv): regenerate PDF"
          git push
